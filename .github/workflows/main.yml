name: Deploy Assemblyline Demo to Pages

on:
  push:
    branches: ["master"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Official Frontend Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Build Official Un-forked Production React App
        run: |
          pnpm install
          pnpm run build  # This outputs the compiled site to the 'dist/' folder

      - name: Upload Static Assets to GitHub Pages
        uses: actions/configure-pages@v4
        # Uses GitHub's native deployment engine to push the 'dist/' directory to Pages
